<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIO MOTOR</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#171717}header{background:#111;color:#fff;padding:18px}nav{max-width:1050px;margin:auto;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:800}.logo span{color:#f5c400}nav a{color:#fff;text-decoration:none;margin-left:15px}.hero{background:#171717;color:#fff;padding:55px 20px}.hero>div,section{max-width:1050px;margin:auto}h1{font-size:42px}.btn{display:inline-block;background:#f5c400;color:#111;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}section{padding:35px 20px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;height:180px;object-fit:cover}.info{padding:15px}.price{font-size:20px;font-weight:bold}.wa{display:block;background:#20b858;color:white;text-align:center;padding:10px;border-radius:7px;text-decoration:none;margin-top:10px}.empty{text-align:center;padding:30px;color:#777}footer{background:#111;color:#aaa;text-align:center;padding:25px}</style></head><body>
<header><nav><div class="logo">ZIO <span>MOTOR</span></div><div><a href="#stok">Stok</a><a href="admin.html">Admin</a></div></nav></header>
<div class="hero"><div><h1>ZIO MOTOR</h1><p>Jual beli motor bekas pilihan di Palembang.</p><a class="btn" href="#stok">Lihat Stok</a></div></div>
<section id="stok"><h2>Stok Motor</h2><div id="list" class="grid"><div class="empty">Memuat stok...</div></div></section>
<section><h2>Kontak</h2><p style="text-align:center">WhatsApp: <b>0812-2200-6993</b><br>Bukit Kemang Manis, Palembang</p></section><footer>© 2026 ZIO MOTOR</footer>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const l=document.getElementById("list");if(!ZIO_CONFIG.url||ZIO_CONFIG.url.includes("GANTI_")){l.innerHTML='<div class="empty">Database belum dihubungkan.</div>';return}
const db=supabase.createClient(ZIO_CONFIG.url,ZIO_CONFIG.anonKey);const r=await db.from("motors").select("*").eq("status","Tersedia").order("created_at",{ascending:false});
if(r.error||!r.data?.length){l.innerHTML='<div class="empty">Belum ada stok motor.</div>';return}
l.innerHTML=r.data.map(m=>'<article class="card"><img src="'+(m.image_url||"https://placehold.co/600x400?text=ZIO+MOTOR")+'"><div class="info"><h3>'+e(m.name)+'</h3><div>Tahun: '+(m.year||"-")+'</div><div>'+e(m.condition||"-")+'</div><p class="price">'+rp(m.price)+'</p><a class="wa" target="_blank" href="https://wa.me/6281222006993?text='+encodeURIComponent("Halo ZIO MOTOR, saya tertarik dengan "+m.name)+'">WhatsApp</a></div></article>').join("");
function e(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function rp(x){return x?new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(x):"Hubungi"}})();
</script></body></html>
