<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin ZIO MOTOR</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.wrap{max-width:800px;margin:auto;padding:20px}.box{background:white;padding:20px;border-radius:12px;margin-bottom:18px}input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}button{padding:12px 18px;border:0;border-radius:7px;background:#f5c400;font-weight:bold}.danger{background:#e53935;color:#fff}.motor{display:flex;gap:12px;align-items:center;border-top:1px solid #ddd;padding:12px 0}.motor img{width:90px;height:65px;object-fit:cover;border-radius:6px}</style></head><body><header style="background:#111;color:#fff;padding:18px"><div class="wrap" style="padding:0"><b>ZIO MOTOR — ADMIN</b></div></header><main class="wrap">
<div id="loginBox" class="box"><h2>Login Admin</h2><input id="email" type="email" placeholder="Email admin"><input id="pass" type="password" placeholder="Password"><button id="loginBtn" type="button">Masuk</button><p id="msg"></p></div>
<div id="panel" style="display:none"><div class="box"><h2>Tambah Motor</h2><input id="name" placeholder="Nama motor"><input id="year" type="number" placeholder="Tahun"><input id="price" type="number" placeholder="Harga"><select id="condition"><option>Bekas</option><option>Siap Pakai</option><option>Mulusan</option></select><input id="photo" type="file" accept="image/*"><button id="saveBtn" type="button">Simpan Motor</button> <button id="logoutBtn" class="danger" type="button">Keluar</button><p id="save"></p></div><div class="box"><h2>Stok</h2><div id="items">Memuat...</div></div></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let db;
function ready(){if(!window.ZIO_CONFIG||!ZIO_CONFIG.url||ZIO_CONFIG.url.includes("GANTI_")||!ZIO_CONFIG.anonKey||ZIO_CONFIG.anonKey.includes("GANTI_")){ $("msg").textContent="Supabase belum dihubungkan. Periksa config.js.";return false }db=supabase.createClient(ZIO_CONFIG.url,ZIO_CONFIG.anonKey);return true}
async function doLogin(){if(!ready())return;$("msg").textContent="Memeriksa...";const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error){$("msg").textContent=r.error.message;return}showPanel()}
function showPanel(){$("loginBox").style.display="none";$('panel').style.display="block";load()}
async function doLogout(){await db.auth.signOut();location.reload()}
async function addMotor(){let f=$("photo").files[0];if(!f)return $("save").textContent="Pilih foto.";let path=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");let u=await db.storage.from("motor-images").upload(path,f);if(u.error)return $("save").textContent=u.error.message;let url=db.storage.from("motor-images").getPublicUrl(path).data.publicUrl;let r=await db.from("motors").insert({name:$("name").value,year:+$("year").value||null,price:+$("price").value||null,condition:$("condition").value,image_url:url,status:"Tersedia"});if(r.error)return $("save").textContent=r.error.message;$("save").textContent="Berhasil disimpan.";$("photo").value="";$("name").value="";$("year").value="";$("price").value="";load()}
async function load(){let r=await db.from("motors").select("*").order("created_at",{ascending:false});$("items").innerHTML=r.error?r.error.message:(r.data?.map(m=>'<div class="motor"><img src="'+m.image_url+'"><div style="flex:1"><b>'+m.name+'</b><br>'+m.year+' · '+rp(m.price)+'</div><button class="danger" type="button" data-id="'+m.id+'">Hapus</button></div>').join("")||"Belum ada stok.");document.querySelectorAll("#items button[data-id]").forEach(b=>b.addEventListener("click",()=>del(b.dataset.id)))}
async function del(id){if(confirm("Hapus motor ini?")){await db.from("motors").delete().eq("id",id);load()}}function rp(x){return x?new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(x):"Hubungi"}
$("loginBtn").addEventListener("click",doLogin);$("saveBtn").addEventListener("click",addMotor);$("logoutBtn").addEventListener("click",doLogout);$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
if(ready()){db.auth.getSession().then(r=>{if(r.data.session)showPanel()})}
</script></body></html>
